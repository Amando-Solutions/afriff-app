<!--
  First paint, before the app's code has started: the AFRIFF emblem on navy
  with a gold loading bar. Nuxt removes it the moment the first screen is ready
  (usually a blink, longer on a cheap phone's first visit). Without it the
  phone shows a blank page while the code loads.

  It can show before the app's stylesheet is live, so it carries its own
  colours (same as the design tokens in app/assets/css/main.css: canvas
  #060A26, gold #D9A441). The emblem is precached by the service worker, so
  it appears offline too.
  Idea from DP Fitness (apps/pwa/app/spa-loading-template.html).
-->
<div class="afriff-boot">
  <img class="afriff-boot__mark" src="/brand/afriff-emblem-192.webp" width="88" height="88" alt="AFRIFF" />
  <div class="afriff-boot__track"><div class="afriff-boot__fill"></div></div>
</div>

<style>
  .afriff-boot {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    background: #060a26;
  }

  .afriff-boot__mark {
    width: 88px;
    height: 88px;
  }

  .afriff-boot__track {
    width: 68px;
    height: 4px;
    border-radius: 999px;
    background: rgb(180 186 230 / 0.16);
    overflow: hidden;
  }

  /* Indeterminate: boot takes as long as it takes. transform-only, so it stays smooth. */
  .afriff-boot__fill {
    width: 40%;
    height: 100%;
    border-radius: 999px;
    background: #d9a441;
    animation: afriff-boot-slide 1.1s ease-in-out infinite;
  }

  @keyframes afriff-boot-slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(250%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .afriff-boot__fill { width: 100%; animation: none; }
  }
</style>
