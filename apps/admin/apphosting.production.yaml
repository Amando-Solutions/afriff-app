# App Hosting backend `afriff-backoffice`: the staff console and door view
# (https://backoffice.afriff.app). Which file a backend reads, and the
# project's Cloud Run quota: see apps/pwa/apphosting.production.yaml.
#
# Sizing: only the festival team opens this app, but its server does the heavy
# work: firebase-admin, festival emails and invitations through Brevo, and
# /api/push/subscribe, which EVERY attendee phone calls when it turns alerts on
# (the "Turn on alerts" card makes that a burst on opening night). So: fewer
# instances than the attendee app, more memory each, and a cap that still
# covers that burst (8 × 80 = 640 requests at the same moment).
runConfig:
  cpu: 1
  memoryMiB: 1024
  concurrency: 80
  maxInstances: 8
  # Staff can wait a second or two for a cold start, and phones retry joining
  # the alerts list by themselves. Nothing kept warm, so nothing billed idle.
  minInstances: 0

# The Firebase web app's public settings (not secrets: firestore.rules protects
# the data). packages/core/nuxt.config.ts defaults them to '', so without them
# the console can't reach the database. Same values in apps/pwa/apphosting.production.yaml.
# No `availability` given = available at build and at run time.
env:
  - variable: NUXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCPxdNaQyK6r4OU97-zBZBKLqHsHunGzYo
  - variable: NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: afriff-app.firebaseapp.com
  - variable: NUXT_PUBLIC_FIREBASE_PROJECT_ID
    value: afriff-app
  - variable: NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: afriff-app.firebasestorage.app
  - variable: NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "396757035301"
  - variable: NUXT_PUBLIC_FIREBASE_APP_ID
    value: "1:396757035301:web:abf6a05cf9014ad3b412cc"
  # Testing switches in the address (?now=, ?queues=sample…) stay OFF here.
  # Only a test backend should ever set this to "true" (packages/core/nuxt.config.ts).
  - variable: NUXT_PUBLIC_TEST_SWITCHES
    value: "false"
